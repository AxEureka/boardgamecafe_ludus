<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ボードゲーム診断 ボードゲーム紹介 ボードゲーム検索 ボドゲ喫茶Ludus</title>
<meta name="description" content="プレイスタイルを分析、ボードゲーム診断！おすすめボードゲーム紹介、目的や気分に応じたボードゲーム検索など。" />

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Great+Vibes&family=Schoolbell&display=swap" rel="stylesheet">

<style>
/* 閉じるボタン制御（既存仕様維持） */
.diary-modal .close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 28px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: #333;
  z-index: 10;
}

.game-card .game-title {
  display: none;
}
</style>
</head>

<body class="top-page">

<div class="page-container">

  <!-- 背景エリア -->
  <div id="bg-wrap">
    <img src="images/cafe.jpg" id="bg-image" alt="カフェ背景">

    <div id="hs-bookshelf" class="clickable hotspot bookshelf">
      <div class="label-paper">検索する</div>
    </div>

    <div id="hs-painting" class="clickable hotspot painting">
      <div class="label-paper">診断する</div>
    </div>

    <div id="hs-cup" class="clickable hotspot cup">
      <div class="label-paper">注文する</div>
    </div>

    <div id="hs-chair" class="clickable hotspot chair">
      <div class="label-paper">このお店って？</div>
    </div>

    <div id="hs-baum" class="clickable hotspot baum"></div>
    <div id="hs-master" class="clickable hotspot master"></div>

    <div id="master-bubble" class="speech-bubble" aria-hidden="true"></div>
    <div class="main-light"></div>
  </div>

  <!-- UI -->
  <header>
    <h1>ボドゲ喫茶 Ludus へようこそ</h1>
    <p class="top-description">
      「ボードゲーム診断」や「ボードゲーム検索」から、あなたが好きそうなボードゲームを提案します。
    </p>
  </header>

  <main>
    <section class="today-section">
      <h2>本日のおすすめ</h2>
      <div id="today-games" class="game-cards"></div>
    </section>
  </main>

</div>

<!-- モーダル -->
<div id="diary-modal" class="diary-modal">
  <div class="diary-content">
    <button id="close-diary" class="close-btn">&times;</button>
    <h3>マスターの日記</h3>
    <p id="diary-text"></p>
  </div>
</div>

<div id="chair-modal" class="diary-modal">
  <div class="diary-content">
    <button id="close-chair" class="close-btn">&times;</button>
    <h3>このお店について</h3>
    <p id="chair-text"></p>
  </div>
</div>

<!-- JSはそのまま（変更なし） -->
<script src="index.js"></script>

</body>
</html>
